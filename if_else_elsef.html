<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #show {
font-size: 50px;
color: rgb(2, 6, 252);
          
        }
        
    </style>
</head>
<body>
    <div id="show"></div>
    <script>
        let score = window.prompt ("input a number");
        if (score>=30){
            document.getElementById("show").innerHTML="pass";
            if(score>=50){
                document.getElementById("show").innerHTML="A";
            }
            if (score>=60){
                document.getElementById("show").innerHTML="A-";
            }
             if (score>=80){
                document.getElementById("show").innerHTML="A+";
            }
        }
        else{
            document.getElementById("show").innerHTML="F";
        }

    </script>
</body>
</html>
