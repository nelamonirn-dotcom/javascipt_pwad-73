<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .blue {
background-color: rgb(177, 247, 175);
    }
    
    </style>
</head>
<body>
    <div id="show"></div>
    <form action="" name="myform">
        <label for="">Name</label><br>
        <input type="text" name="name" placeholder="Enter the name"> <br>
        <label for="">Id</label><br>
        <input type="text" name="id" placeholder="Enter the id"><br>
        <label for="">gender</label><br>
        <input type="radio" name="gender" value="male">male
        <input type="radio" name="gender" value="Female">female
        <input type="radio" name="gender" value="othet">other <br> 
        <label for="">Distric</label>
        <select name="Distric">
            <option selected disabled value="">select One</option>
            <option>noagoan</option>
            <option>cumilla</option>
            <option>Dhaka</option>
            <option>Gagipur</option>
        </select><br>
        <label for=""> Classname </label> 
        <input type="checkbox" class="Classname" value="six">Six
        <input type="checkbox" class="Classname" value="seven">Seven
        <input type="checkbox" class="Classname" value="Eight">Eight
        <input type="checkbox" class="Classname" value="Nine">Nine<br>  
       
        <label for="">Email</label><br>
        <input type="email" name="email" placeholder="Enter the email"><br>
        <label for="">Password</label><br>
        <input type="password" name="password" placeholder="Enter the password"><br>
        <input type="button" onclick="mywindow()" name="submit" value="SUBMIT">
        <input type="button" onclick="mywindow.closed()" name="closed" value="closed">
    </form>
    <script>
        function mywindow(){
            let name = document.myform.name.value;
            let id = document.myform.id.value;
            let gender = document.myform.gender.value;
            let Distric = document.myform.Distric.value;
            let Classname = document.getElementsByClassName("Classname");
            let Classnameoutput = "";
            for (let i = 0 ; i < Classname.length; i++){
               if(Classname[i].checked){
            Classnameoutput += Classname[i].value + ",";
              }
             }
            // alert (Classname);
            let email = document.myform.email.value;
            let password = document.myform.password.value;
            let output = "<div style='background-color:#ccc'>";
            output += "name:" + name + "<br>";
            output += "id:"+ id + "<br>";
            output += "gender:" + gender + "<br>";
            output += "Distric:" + Distric + "<br>";
            output += "Classname:" + Classnameoutput + "<br>";
            output += "email:" + email + "<br>";
            output += "password:" + password + "<br>";
            output += "</div>";
            // document.getElementById("show").innerHTML= output;
            mywindow = window.open("","","height:300,width:400");
            mywindow.document.write(output);
        }
    </script>
</body>
</html>
