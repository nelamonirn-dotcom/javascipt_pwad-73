<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   
    <form action="" name="myform" onsubmit="return validation();">
        <input type="email" name="email" placeholder="Enter your User name"><br>
        <input type="password" name="password" placeholder="Enter your password"><br>
        <input type="submit" name="submit" value="SUBMIT">
    </form>
    <script>
function validation(){
    let email = document.myform.email.value;
    let password = document.myform.password.value;
  
        if(email.search(/^[a-zA-Z0-9]+@[a-zA-Z0-9]+\.[a-zA-Z]{2,}$/)==-1 )  {
            alert("Invalid Email address");
            return false;
        }
        else if (password.search(/^[a-zA-Z0-9]{4,8}$/)== -1){
        alert("Invalid password");
        return false;
       }
    else{
        alert("Email And Password Valid");
    }
}
    </script>
</body>
</html>
