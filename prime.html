<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let n = prompt("Enter the number:")
       n=parseInt(n);
       function test_prime(n){
        if(n===1){
            return n  + "The number is a not prime number."
        }
        if(n===2){
            return n  + "The number is a prime number."
        }
        else{
            for(var x=2; x<n; x++){
                if(n%x==0){
                    return n  + "The number is a not prime number."
                }
            }
             return n  + "The number is a prime number."
        }
       }
document.write(test_prime(n));
    </script>
</body>
</html>
