        function oddoreven(){
            let number = prompt("Enter the value")
            number = parseInt(number);
            if(number%2===0){
                document.write("Enter the number:" + number + "+ Even");
            }
            else{
                 document.write("Enter the number:" + number + "+ odd");
            }
        }
