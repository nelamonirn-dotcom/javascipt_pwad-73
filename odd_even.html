<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function oddoreven(){
            let number = prompt ("please enter  a number:");
            number = parseInt (number);
            if (number%2 === 0){
                alert(" your provided number " + number + " is Even.");

            }
            else {
                alert(" your provided number " + number + " is odd.");
            }
        }
      
        </script>
</head>
<body>
  
        <button onclick="oddoreven()">click here to check if a number is odd or even</button>
        
</body>
</html>
