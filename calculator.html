<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addnumbers(a,b){
            return a+b;
        }
        function subtractnumber(a,b){
            return a-b;
        }
        function multiplynumber(a,b){
            return a*b;
        }
    </script>
</head>
<body>
    <script>
        let sum = addnumbers(20,22);
        alert("sum:"+sum);
        let sub = subtractnumber(20,30);
        alert("sub:" + sub);
        let mul = multiplynumber(20,40);
        alert("mul:" + mul);
    </script>
</body>
</html>
