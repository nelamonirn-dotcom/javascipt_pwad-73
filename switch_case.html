    <script>
        let number1 = Number( prompt("Enter the value1:"));
        let number2 = Number( prompt("Enter the value1:"));
        const oprator = prompt("Enter the oprator:")
        switch (oprator) {
            case "+":
               result =(number1+number2),
                document.write(result)
                break;
            case "-":
                result =(number1-number2),
                document.write(result)
                break;
            case "*":
                result =(number1*number2),
                document.write(result)
                break;
            case "/":
                result =(number1/number2),
                document.write(result)
                break;
        
            default:
                document.write("no opration")
                break;
        }
    </script>
