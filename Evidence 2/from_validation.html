<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>
    <form name="myform" action="" onsubmit=" return abc();">
        <label for="">emali</label><br>
        <input type="email" name="email" placeholder="enteryour email" value=""><br>
        <label for="">password</label><br>
        <input type="password" name="password" placeholder="enteryour password" value=""><br>
        <input type="submit" name="submit" value="submit">
    </form>
    <script>
function abc(){
    let email = document.myform.email.value;
    let password = document.myform.password.value;
    
  let pattern = /^[a-z]+@[a-z]+\.[a-z]{2,4}$/
        if(email.search(pattern) ==-1) {
            alert("Invalid Email address");
            return false;
        }

         else if (password.search(/^[a-zA-Z0-9]{4,}$/)== -1){
        alert("Invalid password");
        return false;
       }
    else{
        alert("Email And Password Valid");
    }
}
    </script>
