<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid rgb(6, 241, 6);
            border-collapse: collapse;
        }
        td{
            padding: 10px;
        }
        </style>
</head>
<body>
    <script>
        const fruits = ["apple", "banana", "cherry","Grapes"];
        const SlName = [1, 2, 3,4];
        let output = "<table border='1px solid green' cellpadding='10px' cellspacing='0px' width='60%'>";
            let output1 = "<table border='1px ' cellpadding='10px' cellspacing='0px' width='60%' > <tr><th>Fruits</th></tr>";
        let i = 0;
        let j = 0; // counter or variable
        while(i< fruits.length ){
            output += "<tr><th>" + SlName[i] + "</th></tr>";
            
            output1 += "<tr><td>" + fruits[j] + "</td></tr>";
            i++;
            j++; //increment or counter
        }
        output += "</table>";
        output1 += "</table>";
        document.write(output);
        document.write(output1);
    </script>
</body>
</html>
